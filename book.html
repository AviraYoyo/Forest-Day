<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Day · Our Book</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-book">

<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="page-head">
    <h1>📖 Our Big Forest Day</h1>
    <div class="sub">
      Our Big Forest Day
    </div>
  </div>

  <div class="mode-switch">
    <button id="autoBtn">🔊 Read this page <span class="cn-text">朗讀本頁</span></button>
    <span class="chip" style="align-self:center">← → arrow keys work too</span>
  </div>

  <div class="book-stage rise" id="bookStage">
    <div class="book-img-wrap">
      <img class="book-img" id="bookImg" src="" alt="">
      <div class="vinyl" id="vinyl" aria-hidden="true">
        <div class="vinyl-disc">
          <div class="vinyl-label"><span>🎵</span></div>
        </div>
      </div>
      <div class="book-page-no" id="bookPageNo"></div>
    </div>
    <div class="book-text" id="bookText"></div>
    <div class="book-nav">
      <button class="btn btn-ghost" id="prevBtn">← Back</button>
      <div class="dots" id="dots"></div>
      <button class="btn btn-primary" id="nextBtn">Next →</button>
    </div>
  </div>

  <!-- ★ 歌曲區：與第 13 頁同一塊（唱片 + 播放器 + 歌詞），固定顯示在繪本下方 -->
  <h2 style="margin:30px 0 10px;font-size:20px">🎵 Forest Friends <span class="cn-text" style="font-weight:400;color:var(--ink-2);font-size:14px">主題曲</span></h2>
  <div class="song-block" id="songBlock">
    <div class="song-block-img">
      <div class="vinyl" aria-hidden="true">
        <div class="vinyl-disc">
          <div class="vinyl-label"><span>🎵</span></div>
        </div>
      </div>
    </div>
    <div class="book-text is-poem" id="songText"></div>
  </div>

  <!-- ★ 暫時隱藏《I Can Try!》迷你讀本區（老師說暫時不需要，需要時把這段註解拿掉即可）
  <h2 style="margin:34px 0 4px;font-size:22px">🦁 I Can Try! <span class="cn-text" style="font-weight:400;color:var(--ink-2);font-size:14px">迷你讀本 — 我很害怕，我可以試試</span></h2>
  <p style="color:var(--ink-2);font-size:14.5px;margin:0 0 14px">
    A tiny book about being brave.
    <span class="cn-text">一個關於勇敢的小故事。讀到最後一句時，全班一起站起來說三次。</span>
  </p>
  <div class="grid g3" id="tryBox"></div>
  -->

</main>

<footer id="footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/book.js"></script>
</body>
</html>
